name: an_do
publish_to: none
description: An Đồ - bản đồ SOS cộng đồng, Android-first.
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

flutter:
  uses-material-design: true
  generate: false

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.1
  http: ^1.5.0
  connectivity_plus: ^6.1.5
  permission_handler: ^12.0.1
  geolocator: ^14.0.3
  flutter_foreground_task: ^10.0.0
  flutter_compass: ^0.8.1
  maplibre_gl: ^0.26.2
  image_picker: ^1.2.0
  flutter_image_compress: ^2.5.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_database: ^12.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  firebase_app_check: ^0.4.0+1
  firebase_analytics: ^12.0.1
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

# Android is the production target in 1.x. iOS will be added after Android validation.
